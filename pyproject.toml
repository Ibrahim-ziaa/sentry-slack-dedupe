[project]
name = "sentry-slack-dedupe"
version = "0.1.0"
description = "Failure alert hub for apps and automations: Sentry, n8n and custom webhooks in, deduped Slack alerts out, with a web console that shows every decision."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sentry_slack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
