[project]
name = "sentry-slack-dedupe"
version = "0.1.0"
description = "Sentry webhook to Slack bridge with fingerprint dedupe and count-based escalation. One bug, one message."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sentry_slack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
